<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- CLAIMS. These tags are promotion for an uncleared Class II CADt device
         (21 CFR 892.2080) and are quoted verbatim in link previews, where they
         travel further than the page itself. They previously read "Reduce
         time-to-review and increase radiologist throughput" and "Reduce
         mistimed findings, improve throughput" — outcome claims with no study
         behind them, and the same class of fabrication removed from the page
         body. Describe what Kroix does and what stage it is at. Nothing else. -->
    <title>Kroix | AI triage for chest X-rays</title>
    <meta name="description" content="A three-model ensemble scores chest X-rays and reorders the radiologist worklist, with every score traceable to the models behind it. Currently in validation." />
    <meta name="author" content="Kroix" />

    <meta property="og:title" content="Kroix — AI triage for chest X-rays" />
    <meta property="og:description" content="Scores studies and reorders the radiologist worklist, with every score traceable. Currently in validation." />
    <meta property="og:type" content="website" />
    <!-- og:image intentionally omitted rather than left pointing at Lovable's
         default artwork, which branded every shared link as someone else's. A
         preview with no image beats a preview with the wrong logo. Add one when
         a real 1200x630 asset exists, and set og:url alongside it. -->

    <meta name="twitter:card" content="summary" />

    <!-- Fonts loaded here rather than only via @import in index.css: a <link>
         is discoverable in the initial HTML, so the browser starts fetching
         before CSS parses, and it cannot be silently stripped by PostCSS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Playfair+Display:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
